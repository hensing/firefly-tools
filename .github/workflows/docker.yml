name: Build & Push

# Builds the image on every push to main that touches the scripts or the
# Dockerfile and pushes it to the GitHub Container Registry. Pull requests
# (Dependabot's included) are built and checked, never pushed.
#
# Versions: a tag vX.Y.Z pushed by hand is a release of that version (major and
# minor steps). Any other build on main is the next patch release: it is pushed
# as X.Y.(Z+1) and the workflow tags the commit vX.Y.(Z+1). Image tags:
# X.Y.Z, X.Y, X and latest (the moving ones only for the highest version), plus
# sha-<commit>.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # Docs-only commits don't rebuild: nothing in the image changed. (Tag
    # pushes ignore path filters.)
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".env.example"
      - ".githooks/**"
      - ".gitleaks.toml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one build at a time: two runs must not pick the same next patch version
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hensing/firefly-tools
  TRIVY_VERSION: v0.76.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the patch release tag
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # all tags, for the next version

      - name: Check the scripts
        run: |
          python3 -m py_compile ff_postprocess.py ff_rules.py ff_subscriptions.py
          bash -n import_amex.sh
          bash -n import_mm.sh
          sh -n entrypoint.sh
          ./import_mm.sh -n samples/Kreditkartentransaktionen_1234xxxxxxxx5678_20260201_120000.csv

      # version: a pushed tag; else a version tag already on this commit (tag
      # and commit pushed together); else the highest version's next patch
      - name: Version and tags
        id: version
        run: |
          SHORT=$(git rev-parse --short=7 HEAD)
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            echo "tags=${IMAGE}:pr-${SHORT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEMVER='^v[0-9]+\.[0-9]+\.[0-9]+$'
          HIGHEST=$(git tag --list 'v*' | grep -E "${SEMVER}" | sort -V | tail -n1 || true)
          NEW=false
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION=${GITHUB_REF_NAME#v}
          elif HERE=$(git tag --points-at HEAD | grep -E "${SEMVER}" | sort -V | tail -n1) && [ -n "${HERE}" ]; then
            VERSION=${HERE#v}
          elif [ -n "${HIGHEST}" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "${HIGHEST#v}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            HIGHEST="v${VERSION}"
            NEW=true
          else
            echo "no version tag yet: push v1.0.0 first" >&2
            exit 1
          fi
          TAGS="${IMAGE}:${VERSION},${IMAGE}:sha-${SHORT}"
          if [ "v${VERSION}" = "${HIGHEST}" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSION%.*},${IMAGE}:${VERSION%%.*},${IMAGE}:latest"
          fi
          echo "Version ${VERSION} (new tag: ${NEW}) -> ${TAGS}"
          { echo "version=${VERSION}"; echo "new=${NEW}"; echo "tags=${TAGS}"; } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # BuildKit pinned: another version may compress layers differently,
      # which would change the digest of identical content.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:v0.34.2

      # Reproducible build: every timestamp in the image is set to the base
      # image's creation time, so a rebuild of unchanged content gets the same
      # digest and the consumer (digest-pinned) sees no update.
      - name: Derive SOURCE_DATE_EPOCH from the base image
        id: epoch
        run: |
          BASE=$(grep -E '^FROM ' Dockerfile | tail -n1 | awk '{print $2}')
          EPOCH=$(docker buildx imagetools inspect "${BASE}" --format '{{ (index .Image "linux/amd64").Created.Unix }}')
          test "${EPOCH}" -gt 0
          echo "Base ${BASE} -> SOURCE_DATE_EPOCH=${EPOCH} ($(date -u -d "@${EPOCH}"))"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No provenance/SBOM attestations: they carry build timestamps and run
      # ids, so the index digest would differ on every build. The source label
      # links the package to this repository on GitHub.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},rewrite-timestamp=true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Firefly III tools: rules and subscriptions from tables, post-processing after the import
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          sbom: false
          provenance: false

      # after the push: a failed build leaves no tag behind. Pushed with
      # GITHUB_TOKEN, so it starts no second run.
      - name: Tag the patch release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Trivy (pinned release)
        run: curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      - name: Scan with Trivy
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
